name: Aggiorna albo pretorio

on:
  schedule:
    # tre volte al giorno (orari UTC: in Italia circa 7, 13 e 19)
    - cron: "17 5,11,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-albo
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepara l'ambiente
        run: python -m pip install --quiet cryptography

      - name: Scarica l'albo e rigenera i dati cifrati
        env:
          ALBO_CHIAVE: ${{ secrets.ALBO_CHIAVE }}
        run: python scripts/aggiorna_albo.py

      - name: Salva i dati aggiornati
        run: |
          git config user.name "Aggiornamento albo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Albo aggiornato $(date -u +%Y-%m-%d)"
            git push
          fi
