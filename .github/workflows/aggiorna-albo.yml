name: Aggiorna albo pretorio

on:
  schedule:
    # tre volte al giorno (orari UTC: in Italia circa 7, 13 e 19)
    - cron: "17 5,11,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-albo
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Scarica l'albo e rigenera calendario
        run: python3 scripts/aggiorna_albo.py

      - name: Salva i dati aggiornati
        run: |
          git config user.name "Aggiornamento albo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Albo aggiornato $(date -u +%Y-%m-%d)"
            git push
          fi
